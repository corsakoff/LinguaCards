<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaCards — тесты</title>
  <style>
    body { max-width: 900px; margin: 40px auto; padding: 0 20px; font: 16px/1.5 system-ui, sans-serif; background: #1c1c2e; color: #f0f0f5; }
